name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Backtest (ranking must beat signal-count baseline)
        run: python -c "import backtest,sys; r=backtest.main(); m=lambda k: sum(r[k])/len(r[k]); sys.exit(0 if m('this model') > m('signal count') else 1)"
